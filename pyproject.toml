[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpi3v-processing"
version = "0.1.0"
description = "Processing, calibration, analysis, and machine-learning tools for CPI-3V data"
readme = "README.md"
requires-python = ">=3.10,!=3.12.0"
authors = [
  {name = "Paul Connolly"},
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python>=4.8",
  "scikit-image>=0.22",
  "matplotlib>=3.8",
  "tqdm>=4.66",
  "h5py>=3.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.6",
]
ml = [
  "keras>=3.0",
  "tensorflow>=2.16",
]
output = [
  "netCDF4>=1.6",
  "hdf5storage>=0.2",
]
dev = [
  "pytest>=8",
]

[project.scripts]
cpi-calibrate = "calibration.gui:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["calibration*"]
