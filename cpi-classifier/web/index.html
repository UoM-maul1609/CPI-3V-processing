<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ice Crystal Classifier</title>
<meta name="description" content="Browse and classify CPI ice crystal images from research flights and ground sites.">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/classify" aria-label="Ice Crystal Classifier home">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#flake"/></svg>
    <span>Ice Crystal Classifier</span>
  </a>
  <nav class="mainnav" aria-label="Main">
    <a href="#/classify" data-route="classify">Classify</a>
    <a href="#/flights" data-route="flights">Flights</a>
    <a href="#/progress" data-route="progress">Progress</a>
    <a href="#/guide" data-route="guide">Guide</a>
    <a href="#/admin" data-route="admin" id="adminNav" hidden>Admin</a>
  </nav>
  <div class="topbar-right">
    <button class="iconbtn" id="themeBtn" title="Switch light / dark" aria-label="Switch light or dark theme">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
    <div id="userBox"></div>
  </div>
</header>

<main id="view"></main>

<!-- Sign in / create account -->
<dialog id="authDlg" class="dlg">
  <form method="dialog" class="dlg-inner" id="authForm" novalidate>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="login" aria-selected="true">Sign in</button>
      <button type="button" role="tab" data-tab="register" aria-selected="false" id="regTab">Create account</button>
    </div>
    <p class="dlg-why" id="authWhy">Sign in so your classifications are saved under your name.</p>
    <label class="fld"><span>Username</span><input name="username" autocomplete="username" required></label>
    <label class="fld reg-only"><span>Your name <small>(shown on the progress page)</small></span><input name="display_name" autocomplete="name"></label>
    <label class="fld reg-only"><span>Email <small>(optional)</small></span><input name="email" type="email" autocomplete="email"></label>
    <label class="fld"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <label class="fld reg-only code-only"><span>Registration code</span><input name="code" autocomplete="off"></label>
    <label class="check login-only keepme"><input type="checkbox" name="remember" value="1"> Keep me signed in on this computer <small class="muted">(until I sign out; not on shared computers)</small></label>
    <p class="formerr" id="authErr" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" class="btn ghost" value="cancel" id="authCancel">Cancel</button>
      <button type="submit" class="btn primary" id="authSubmit">Sign in</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flake" viewBox="0 0 32 32">
    <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M16 3v26M4.7 9.5l22.6 13M4.7 22.5l22.6-13"/>
      <path d="M12.5 5.5 16 9l3.5-3.5M12.5 26.5 16 23l3.5 3.5M5 14l4.8 1.2L8.5 20M27 18l-4.8-1.2L23.5 12M5 18l4.8-1.2L8.5 12M27 14l-4.8 1.2L23.5 20"/>
    </g>
  </symbol>
  <symbol id="i-plane" viewBox="0 0 24 24"><path fill="currentColor" d="M21 15.5v-2l-8-5V3.8a1.5 1.5 0 0 0-3 0v4.7l-8 5v2l8-2.5V18l-2 1.5V21l3.5-1 3.5 1v-1.5L13 18v-5z" transform="translate(1 0)"/></symbol>
  <symbol id="i-ground" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M3 20h18M7 20V9l5-4 5 4v11M10 20v-5h4v5"/></symbol>
</svg>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
