# Ice Crystal Classifier: Apache settings.
#
# Layout (see deploy/DEPLOY.md):
#   /var/www/html/cpi   -> symbolic link to /var/www/cpi/cpi3v/cpi-classifier/web   (the page, served from the usual web root)
#   /var/www/cpi/data      images, catalogues, project pages   (served at /cpi/data/)
#   /var/www/cpi/cpi3v     your repository                      (not served: .git, Python code)
#
# Install:
#   sudo cp apache-cpi-classifier.conf /etc/apache2/conf-available/cpi-classifier.conf
#   sudo a2enmod headers && sudo a2enconf cpi-classifier && sudo apache2ctl configtest && sudo systemctl reload apache2
# The site is then http://<server>/cpi/ in every virtual host whose DocumentRoot is /var/www/html.

Define CPI_WEB  /var/www/html/cpi
Define CPI_DATA /var/www/cpi/data

# --- particle images, catalogues and project pages (written by imports and the Admin page)
Alias /cpi/data ${CPI_DATA}
<Directory ${CPI_DATA}>
    Options -Indexes -ExecCGI +FollowSymLinks
    AllowOverride None
    Require all granted
    # nothing in here is ever run as code (project pictures are uploaded here)
    <IfModule mod_php7.c>
        php_admin_flag engine off
    </IfModule>
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
    <FilesMatch "(^\.|\.(php\d?|phtml|phar|cgi|pl|py|sh)$)">
        Require all denied
    </FilesMatch>
    <IfModule mod_headers.c>
        # lists and catalogues change when you import: always check for a newer copy
        <FilesMatch "\.(json|bin)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        <FilesMatch "\.(png|jpe?g|gif|webp)$">
            Header set Cache-Control "max-age=3600"
            Header set X-Content-Type-Options "nosniff"
        </FilesMatch>
    </IfModule>
</Directory>

# --- the web page and its PHP API (in the web root through the /var/www/html/cpi link)
<Directory ${CPI_WEB}>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.html index.php
    <IfModule mod_headers.c>
        # the page's own code: check for updates after a git pull
        <FilesMatch "\.(html|js|css)$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "same-origin"
    </IfModule>
</Directory>
<Directory ${CPI_WEB}/api>
    # project pictures up to 25 MB
    <IfModule mod_php7.c>
        php_value upload_max_filesize 32M
        php_value post_max_size 40M
    </IfModule>
    <IfModule mod_php.c>
        php_value upload_max_filesize 32M
        php_value post_max_size 40M
    </IfModule>
    <FilesMatch "\.(sql|md|sample\.php)$">
        Require all denied
    </FilesMatch>
</Directory>
<Directory ${CPI_WEB}/api/tools>
    Require all denied
</Directory>
<Directory ${CPI_WEB}/api/schema>
    Require all denied
</Directory>

# Optional, until it's ready for the world: only allow the university network.
# Use this in both <Directory ${CPI_DATA}> and <Directory ${CPI_WEB}> instead of "Require all granted":
#   Require ip 130.88.0.0/16 10.0.0.0/8 127.0.0.1 ::1
