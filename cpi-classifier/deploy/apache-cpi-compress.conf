# Ice Crystal Classifier: compress particle catalogues on the way to the browser, and let
# browsers keep particle images. Kept separate from cpi-classifier.conf so it can be added
# without touching your access rules there.
#   sudo cp apache-cpi-compress.conf /etc/apache2/conf-available/cpi-compress.conf
#   sudo a2enmod deflate headers && sudo a2enconf cpi-compress && sudo apache2ctl configtest && sudo systemctl reload apache2
# The data folder is matched both where it lives and where the site reaches it
# (/var/www/html/cpi/data through the link): change the paths if yours differ.
<DirectoryMatch "^/var/www/(cpi|html/cpi)/data">
    <IfModule mod_deflate.c>
        # catalogues and their columns (json, bin); PNGs are compressed already
        <FilesMatch "\.(json|bin)$">
            SetOutputFilter DEFLATE
        </FilesMatch>
    </IfModule>
    <IfModule mod_headers.c>
        # catalogue columns: check for a newer copy, but reuse the one we have if unchanged
        <FilesMatch "\.bin$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
        # particle images: reuse for a day without asking. Thousands of small images each
        # needing a "has it changed?" round trip is slow through a tunnel or VPN. After a
        # re-import, a browser may show an old image for up to a day (Ctrl+Shift+R refreshes).
        <FilesMatch "\.png$">
            Header set Cache-Control "max-age=86400"
        </FilesMatch>
    </IfModule>
</DirectoryMatch>
