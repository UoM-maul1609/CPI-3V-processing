# Ice Crystal Classifier: compress particle catalogues on the way to the browser.
# Kept separate from cpi-classifier.conf so it can be added without touching your
# access rules there.
#   sudo cp apache-cpi-compress.conf /etc/apache2/conf-available/cpi-compress.conf
#   sudo a2enmod deflate headers && sudo a2enconf cpi-compress && sudo apache2ctl configtest && sudo systemctl reload apache2
<Directory /var/www/cpi/data>
    <IfModule mod_deflate.c>
        <FilesMatch "\.(json|bin)$">
            SetOutputFilter DEFLATE
        </FilesMatch>
    </IfModule>
    <IfModule mod_headers.c>
        # catalogue columns: check for a newer copy, but reuse the one we have if unchanged
        <FilesMatch "\.bin$">
            Header set Cache-Control "no-cache"
        </FilesMatch>
    </IfModule>
</Directory>
